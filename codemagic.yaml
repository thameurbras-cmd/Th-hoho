workflows:
  android-apk:
    name: Th-hoho Android APK
    max_build_duration: 30
    
    environment:
      flutter: 3.35.7
      java: 17
    scripts:
      - name: Generate android/ (in a temp dir, copy only android/)
        script: |
          flutter create --platforms=android --org com.thhoho --project-name th_hoho /tmp/gen
          rm -rf android && cp -r /tmp/gen/android ./android
      - name: Patch manifest and gradle
        script: python3 tool/patch_android.py
      - name: Fetch tessdata (ara + fra)
        script: bash tool/fetch_tessdata.sh
      - name: flutter pub get
        script: flutter pub get
      - name: Parser tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
      - name: Verify models are inside the APK
        script: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep -E "tessdata/ara.traineddata"
          unzip -l "$APK" | grep -E "tessdata/fra.traineddata"
          unzip -l "$APK" | grep -E "tessdata_config.json"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
